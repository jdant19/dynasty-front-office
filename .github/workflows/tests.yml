name: tests
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: pip install -r requirements.txt
      - name: Rebuild history tables and fail if they changed unexpectedly
        run: |
          PYTHONPATH=src python -m dfo.ingest.build_history
          git diff --stat -- data/processed
      - run: python -m pytest -q
